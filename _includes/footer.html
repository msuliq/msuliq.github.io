{%- comment -%}
  Footer. Social links as plain text, then a muted line for agents.
{%- endcomment -%}

<footer class="container-narrow mt-24 pb-16 text-muted">
  <ul class="flex flex-wrap gap-x-5 gap-y-2 mb-6">
    {%- for s in site.data.site.social -%}
    <li>
      <a
        href="{{ s.url }}"
        class="text-muted no-underline hover:text-ink"
        rel="noopener me"
        target="_blank"
        data-track="outbound"
        data-track-label="{{ s.name | downcase }}"
        data-track-location="footer">{{ s.name }}</a>
    </li>
    {%- endfor -%}
  </ul>

  <p class="text-sm">
    &copy; {{ 'now' | date: '%Y' }} {{ site.data.site.author.name }}
    <span class="block mt-1">
      For AI agents:
      <a href="{{ '/llms.txt' | relative_url }}" class="text-muted hover:text-ink">llms.txt</a>,
      <a href="{{ '/llms-full.txt' | relative_url }}" class="text-muted hover:text-ink">full profile</a>,
      <a href="{{ '/profile.json' | relative_url }}" class="text-muted hover:text-ink">profile.json</a>
    </span>
  </p>
</footer>
