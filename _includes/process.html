{%- comment -%}
  How a fixed-price project runs, for the services variant. Reads
  site.data.site.process: step, body. Numbered rows.
{%- endcomment -%}

<section id="process" class="container-narrow section">
  <h2 class="section-label">How it works</h2>

  <ol class="rows">
    {%- for p in site.data.site.process -%}
    <li class="flex gap-4">
      <span class="text-muted tabular-nums">{{ forloop.index }}.</span>
      <div>
        <h3 class="row-title">{{ p.step }}</h3>
        <p class="row-meta">{{ p.body }}</p>
      </div>
    </li>
    {%- endfor -%}
  </ol>
</section>
