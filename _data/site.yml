# ─────────────────────────────────────────────────────────────────────────────
# Services page (services.html) - what I build for support and ops teams,
# anonymized proof, and how a fixed-price project runs. Employer and
# product names stay out of this copy on purpose.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - title: Support tooling for Intercom teams
    body: >-
      Conversations tagged and routed on arrival, account and billing context pulled
      into the inbox so agents stop switching tabs, escalations posted to the right
      Slack channel, and SLA risks flagged before they turn into churn.
  - title: In-house AI models
    body: >-
      AI that runs on your own servers, so customer data never goes to a third-party AI
      provider. That matters for security, for your customers' privacy, and for rules
      like GDPR, HIPAA, and the data residency terms in your contracts. I fine-tune
      lightweight open-source models into experts on your subject, connect them to your
      internal tools, and debug them when the answers go wrong.
  - title: Integrations and two-way syncs
    body: >-
      Intercom, Salesforce, Stripe, Slack, your own app, or any REST API. Verified
      webhooks, retries, and idempotent handlers, so a record is never written twice
      and a failed call never disappears silently.
  - title: Authentication and login security
    body: >-
      Single sign-on over SAML and OpenID Connect with Entra ID, Cloudflare Access, or
      any identity provider. OAuth sign-in, passkeys, two-factor authentication, and
      bot protection with reCAPTCHA and Cloudflare Turnstile that stops fake signups
      without punishing real users.
  - title: APIs, clients and servers
    body: >-
      REST APIs for your product with API keys, scopes, rate limits, and OpenAPI docs.
      OAuth provider or client, depending on which side of the connection you are.
      Clients for third-party APIs that handle pagination, retries, and token refresh.
  - title: Internal tools that replace spreadsheets
    body: >-
      Admin panels, ops consoles, and approval flows with roles and an audit log. The
      spreadsheet three people edit at once becomes a tool with one source of truth.
  - title: Dashboards and reporting
    body: >-
      The numbers someone assembles by hand every Monday, live on one screen, plus
      scheduled digests to Slack or email.
  - title: Security built in, not bolted on
    body: >-
      My background is security engineering. Least-privilege API scopes, secrets kept
      out of code, signed webhooks, and audit trails come standard, because your
      tools touch customer data.

case_studies:
  - title: Subject-expert AI on modest hardware
    context: In-house AI, self-hosted
    body: >-
      Lightweight open-source models fine-tuned into experts in one specific field, so
      they run in house on modest hardware instead of an expensive general model. Tuned
      the output language so answers read naturally to customers and improve their
      experience.
    stack: [PyTorch, Hugging Face, LoRA, vLLM, llama.cpp]
  - title: Company-wide authentication platform
    context: Top-10 global certificate authority
    body: >-
      Sole architect of login and identity for tens of thousands of daily users: OAuth2,
      OpenID Connect, SAML, external identity providers, and the OAuth provider side, not
      only the client. Extracted authentication into its own service with sessions that
      work across services, and closed account-takeover and second-factor-bypass paths.
    stack: [Rails, OAuth2, OIDC, SAML, PostgreSQL]
  - title: Bot protection at 1,000+ fake signups a day
    context: Top-10 global certificate authority
    body: >-
      Layered signup defense with reCAPTCHA v2/v3 and Cloudflare Turnstile, plus
      countermeasures for human CAPTCHA farms that solve challenges by hand. Fake
      accounts stopped without adding friction for real customers.
    stack: [Rails, reCAPTCHA, Turnstile, Redis]
  - title: Stripe billing that cannot double-apply
    context: SaaS product, Ruby on Rails
    body: >-
      Full subscription lifecycle - checkout, upgrades, cancellations, refunds, failed
      payments, trial reminders, and disputes - driven by eight Stripe webhook events.
      Every event is recorded before it is processed, so Stripe's retries never charge,
      refund, or downgrade anyone twice.
    stack: [Rails, Stripe, PostgreSQL]
  - title: An MCP server and Claude plugin for a live product
    context: SaaS product, Ruby on Rails + Python
    body: >-
      Seventeen tools that let Claude work inside a user's own account, behind OAuth
      with PKCE, dynamic client registration, a mandatory consent screen, and the same
      read/write/admin scopes as the REST API. Shipped as a published Claude Code
      plugin with slash commands, skills, and an eval suite run before each release.
    stack: [Rails, OAuth 2.1, MCP, Python]
  - title: One business layer, three surfaces
    context: Standalone service, Go
    body: >-
      A Go service where the web UI, the MCP endpoint, and a JSON API all run through
      one tool registry, so they cannot drift apart. Callers subscribe to state changes
      through HMAC-signed webhook callbacks, and every state change is written to an
      event log in the same transaction.
    stack: [Go, htmx, SQLite, MCP]
  - title: Team alerts where people already work
    context: SaaS product, Ruby on Rails
    body: >-
      Per-team notifications over Slack, email, and custom webhooks. Destination URLs
      are resolved and checked before use, so a customer-supplied webhook cannot be
      pointed at internal infrastructure.
    stack: [Rails, Slack, Webhooks]
  - title: Admin console and email pipeline
    context: SaaS product, Ruby on Rails + Hotwire
    body: >-
      Internal console for users, teams, subscriptions, capacity, and monitoring stats.
      Moved the newsletter off a third-party email platform onto Amazon SES, with
      bounce and complaint handling over verified SNS notifications.
    stack: [Rails, Hotwire, Amazon SES, SNS]
  - title: Staff tooling for fraud and abuse response
    context: Top-10 global certificate authority
    body: >-
      Internal detection and review tooling that pairs LLM-assisted pattern matching
      with human-led forensics, taking the team from first signal to mitigation in
      minutes instead of days. Also covered staff and admin activity, not only
      customer accounts.
    stack: [Rails, PostgreSQL, LLMs]

process:
  - step: Tell me what your team does by hand
    body: >-
      A 15-minute call or a short message. Which tools, which steps, and how often.
  - step: Written scope and a fixed price
    body: >-
      What it will do, what it will not do, and how we will both know it is done. You
      pay per project, not per hour.
  - step: Built in your accounts, demoed as it grows
    body: >-
      Code lives in your repository and credentials in your accounts from day one.
      You see working pieces at each milestone, not a big reveal at the end.
  - step: Handoff you can run without me
    body: >-
      Setup notes, a runbook for when something breaks, and a fix window after launch
      included in every quote.

