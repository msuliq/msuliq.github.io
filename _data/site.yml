# ─────────────────────────────────────────────────────────────────────────────
# Open source projects - rendered as cards. Stars are fetched live via
# the GitHub public API at page load (cached 1h in localStorage).
# ─────────────────────────────────────────────────────────────────────────────
open_source:
  - name: domain_sanity
    repo: msuliq/domain_sanity
    description: >-
      Strict domain-name validation the way a certificate authority must: RFC 1035
      labels, IDN/punycode, Public Suffix List, CA/Browser Forum wildcard rules, and
      IP, reserved-range, and reverse-zone detection.
    language: Ruby
  - name: csr_peek
    repo: msuliq/csr_peek
    description: >-
      Safe, dependency-free CSR and X.509 certificate inspection - subject, SANs, key
      strength, weak-signature checks, and a pluggable Baseline Requirements policy.
    language: Ruby
  - name: svg_sentinel
    repo: msuliq/svg_sentinel
    description: >-
      Lint or sanitize untrusted SVG - blocks scripts, event handlers, XXE, and
      external references, with a CLI and SARIF output for CI pipelines.
    language: Ruby
  - name: omniauth_oidc
    repo: msuliq/omniauth_oidc
    description: >-
      OmniAuth strategy for OpenID Connect (OIDC) with first-class support for
      Microsoft Entra ID and Cloudflare Access.
    language: Ruby
  - name: ip_geo_lookup
    repo: msuliq/ip_geo_lookup
    description: >-
      Lightweight IP geolocation lookup for Ruby - useful for fraud detection,
      access control, and request enrichment.
    language: Ruby
  - name: balloon_hashing
    repo: msuliq/balloon_hashing
    description: >-
      Implementation of the Balloon memory-hard password hashing algorithm.
    language: Ruby
  - name: yescrypt
    repo: msuliq/yescrypt
    description: >-
      Yescrypt password hashing implementation, the successor to scrypt.
    language: Ruby

# ─────────────────────────────────────────────────────────────────────────────
# Writing - Medium articles, blog posts, talks.
# ─────────────────────────────────────────────────────────────────────────────
writing:
  - title: Rendering User-Supplied SVG Without Getting Burned
    url: https://msuliq.medium.com/rendering-user-supplied-svg-without-getting-burned-f0e78d2172f8
    summary: >-
      An SVG is not an image, it is a program the browser runs. What can hide in an
      uploaded avatar or logo, and a small gem that finds it or cleans it out.
      Companion to svg_sentinel.
    tag: Security
  - title: "Memory-Hard Password Hashing in Ruby: Balloon and yescrypt"
    url: https://msuliq.medium.com/memory-hard-password-hashing-in-ruby-balloon-and-yescrypt-bf928bd58452
    summary: >-
      Being slow is no longer enough against GPU farms. A password hash also has to be
      expensive to remember. Two ways to do that in Ruby, and when to use each.
    tag: Cryptography
  - title: The Attacker Doesn't Need to Know Your Programming Language Anymore
    url: https://msuliq.medium.com/the-attacker-doesnt-need-to-know-your-programming-language-anymore-21b451abbb41
    summary: >-
      LLMs did not make attackers smarter, they made them cheaper. What your front end
      tells the world, and why reading it just got easy.
    tag: Security
  - title: Adding OpenID Connect Login to Rails Without the Dependency Pile
    url: https://msuliq.medium.com/adding-openid-connect-login-to-rails-without-the-dependency-pile-f8bfffd38e89
    summary: >-
      How OpenID Connect actually works, and two small Ruby gems that add "log in with
      your work account" to Rails with almost no dependencies.
    tag: Authentication
  - title: The Attacker Filed a Support Ticket
    url: https://msuliq.medium.com/the-attacker-filed-a-support-ticket-8939e632046d
    summary: >-
      Some complaints are not feedback. They are an attack on the people who can turn
      your defenses off. How to tell a real complaint from a paid one.
    tag: Fraud
  - title: "Post-Quantum Cryptography Is Here: What FIPS 203, 204, and 205 Mean for Engineers"
    url: https://msuliq.medium.com/post-quantum-cryptography-is-here-what-fips-203-204-and-205-mean-for-engineers-75c1293e2175
    summary: >-
      The post-quantum standards are official. The short, practical version of what
      changed and what engineers should do about it, with no lattice math.
    tag: Cryptography
  - title: Bringing a Post-Quantum Signature into Ruby
    url: https://msuliq.medium.com/bringing-a-post-quantum-signature-into-ruby-47878d6bb166
    summary: >-
      NIST finalized ML-DSA in 2024, but Ruby had no easy way to use it. So I wrapped
      it, and the wrapping is where the interesting engineering lives. Companion to
      ml_dsa.
    tag: Cryptography
  - title: 300 Fake Signups a Day, and the CAPTCHA Was Losing
    url: https://msuliq.medium.com/300-fake-signups-a-day-and-the-captcha-was-losing-5d6d3d8a4802
    summary: >-
      Bots do not solve CAPTCHAs anymore, people do. What it takes to defend a signup
      flow when the attacker's economics beat yours.
    tag: Fraud
  - title: Post-Quantum Keys Don't Need OpenSSL
    url: https://msuliq.medium.com/post-quantum-keys-dont-need-openssl-54077ef35688
    summary: >-
      Why save a quantum-proof key through the biggest classical crypto library? A
      small C codec that cuts the cord, and how little ASN.1 you actually need.
    tag: Cryptography
  - title: How I Parse Domain Names For a Certificate Authority
    url: https://msuliq.medium.com/how-i-parse-domain-names-for-a-certificate-authority-92a940f32bea
    summary: >-
      The surprisingly deep rules behind validating a domain name: RFC label
      limits, IDN/punycode, the Public Suffix List, and the edge cases that
      break naive checks. Companion to the domain_sanity gem.
    tag: PKI
  - title: We Reset the Password. We Reset 2FA. The Attacker Came Back in Seconds.
    url: https://msuliq.medium.com/we-reset-the-password-we-reset-2fa-the-attacker-came-back-in-seconds-17575ad55246
    summary: >-
      A session hijacking war story: an attacker who survived password resets,
      2FA resets, and full endpoint forensics, and the application-layer defense
      that finally ended it.
    tag: Security
  - title: "A Secret You Cannot See Is Safer: Building a Secure Memory Buffer in C"
    url: https://msuliq.medium.com/a-secret-you-cannot-see-is-safer-building-a-secure-memory-buffer-in-c-876839dd6a66
    summary: >-
      Where a private key really lives while you use it, and a small C library
      (libpqcsb) that keeps it off swap, out of core dumps, and behind guard
      pages. What each protection actually buys you.
    tag: Cryptography
  - title: "Trust, but Instrument: The Insider Threat Playbook"
    url: https://msuliq.medium.com/trust-but-instrument-the-insider-threat-playbook-c134742b7de0
    summary: >-
      News-anchored playbook (Apple/OpenAI, Rippling v. Deel, Coinbase) for
      catching insider threats: log reads not just writes, baseline behavior,
      plant canaries, and gate privileged access.
    tag: Security
  - title: How to Stop SMS Pump Fraud From Draining Your Wallet (and Sanity)
    url: https://medium.com/@msuliq/how-to-stop-sms-pump-fraud-from-draining-your-wallet-and-sanity-11ea5435608d
    summary: >-
      Practical playbook for detecting and shutting down SMS pumping attacks,
      drawn from production experience defending a global PKI vendor.
    tag: Fraud
  - title: Authenticating with OmniAuth and OpenID Connect (OIDC) in Rails
    url: https://msuliq.medium.com/authenticating-with-omniauth-and-openid-connect-oidc-in-ruby-on-rails-applications-e136ec5b48c0
    summary: >-
      Step-by-step guide to wiring OIDC authentication into a Ruby on Rails
      application using the omniauth_oidc gem.
    tag: Authentication

