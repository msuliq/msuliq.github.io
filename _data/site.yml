# yaml-language-server: $schema=
# ─────────────────────────────────────────────────────────────────────────────
# Site data — single source of truth for everything that varies.
# Pages and includes read from this file via {{ site.data.site.* }}.
#
# Note on the directive above: it disables YAML schema validation for this
# file. Without it, IDE language servers misidentify _data/*.yml files as
# Jekyll _config.yml and flag every property as "not allowed". This file is
# free-form data, not Jekyll config — Jekyll itself reads it correctly.
# ─────────────────────────────────────────────────────────────────────────────

author:
  name: Suleyman Musayev
  short_title: Senior Backend Engineer
  long_title: Senior Backend Engineer · Auth, Identity & High-Scale Systems
  location: Ashgabat, Turkmenistan
  timezone: UTC+5
  remote: true
  visa_required: true
  open_to: Senior, Staff, Security, IAM, and Product Engineering roles

# ─────────────────────────────────────────────────────────────────────────────
# Contact
#
# Email is intentionally NOT stored in plain text here. The base64-encoded
# local-part and domain live in js/app.js and are assembled only on click.
# Each page sets `email_alias` in its front matter so we can route the
# variants (+blog, +security, +product, +startup, +bigtech).
# ─────────────────────────────────────────────────────────────────────────────
contact:
  booking_url: "https://calendly.com/msuliq"
  booking_label: "Book a 15-min intro"
  linkedin_message_url: "https://www.linkedin.com/in/smusayev"

# ─────────────────────────────────────────────────────────────────────────────
# Social profiles — rendered in the footer and contact section.
# ─────────────────────────────────────────────────────────────────────────────
social:
