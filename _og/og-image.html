<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG image generator - screenshot this at 1200×630</title>
  <style>
    /* Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /*
     * The card is fixed at 1200×630 - the exact aspect ratio LinkedIn,
     * Twitter/X, Facebook, and Slack expect for OG images.
     *
     * Workflow:
     *   1. open this file in Chrome
     *   2. Cmd+Shift+P → "Capture full size screenshot"
     *      (or right-click → Inspect → 3-dot menu → Capture full size screenshot)
     *   3. Save as ../images/og-image.jpg (use Preview to convert PNG → JPG)
     */
    /* Flat grayscale, matching the site: no gradients, no accent. */
    .card {
      width: 1200px;
      height: 630px;
      background: #111111;
      color: #ededed;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 64px;
      align-items: center;
      padding: 80px 96px;
    }

    .headshot {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      object-fit: cover;
    }

    .body {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .eyebrow {
      font-size: 28px;
      font-weight: 400;
      color: #a0a0a0;
    }

    .name {
      font-size: 72px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: #ededed;
    }

    .tagline {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.35;
      color: #a0a0a0;
      max-width: 700px;
    }

    .footer {
      margin-top: 12px;
      font-size: 24px;
      color: #a0a0a0;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="headshot" src="../images/01.jpg" alt="">

    <div class="body">
      <p class="eyebrow">Suleyman Musayev</p>
      <h1 class="name">Senior Staff<br>Engineer</h1>
      <p class="tagline">
        I design and scale the distributed systems
        behind a top-10 certificate authority.
      </p>
      <p class="footer">msuliq.github.io</p>
    </div>
  </div>
</body>
</html>
